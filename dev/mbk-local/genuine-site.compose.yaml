# Merge after compose.yaml + apps.compose.yaml; never replaces the old site.
services:
  site-genuine:
    image: mbk-local/php:8.4
    pull_policy: never
    profiles: [genuine-site]
    command: [sh, /local/start-app.sh]
    working_dir: /app
    env_file: ../../logs/local-stack-2026-11-06/runtime/site-genuine.env
    volumes:
      - ../../logs/local-stack-2026-11-06/sources/project-1/www:/app:ro
      - site-vendor:/app/vendor:ro
      - ./start-app.sh:/local/start-app.sh:ro
      - ./router.php:/local/router.php:ro
      - ./runtime-probe.php:/local/runtime-probe.php:ro
      - ./php-local.ini:/usr/local/etc/php/conf.d/zz-mbk-local.ini:ro
    tmpfs:
      - /tmp:uid=1000,gid=1000
      - /app/storage:uid=1000,gid=1000
      - /app/bootstrap/cache:uid=1000,gid=1000
      - /app/database/csv:uid=1000,gid=1000
    networks: [isolated]
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
