server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Реплика клиента едет в строке запроса: SSE открывается нативным
    # EventSource, а он умеет только GET (frontend/src/api.js). Умолчание
    # nginx на строку запроса — 8 КБ, и русский текст в процентах-кодировке
    # разбухает вшестеро: примерно с полутора тысяч знаков nginx отвечал 414,
    # клиент видел «Соединение прервано», а в логах бэкенда не появлялось
    # ничего — запрос до него не доходил. Приложение при этом обещает принять
    # 2000 знаков (MBK_MAX_MESSAGE_CHARS) и аккуратно обрезает лишнее само.
    # Запас взят по худшему случаю: символ Unicode — до четырёх байт, байт —
    # три знака кодировки. Сверяется тестом tests/test_message_transport_limit.py.
    large_client_header_buffers 4 32k;

    # SPA fallback: всё, что не файл — index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Прокси к FastAPI (docker compose service "backend" на порту 8000)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # === КРИТИЧНО для SSE ===
        proxy_set_header Connection '';                # отключаем keepalive чанкинг
        proxy_buffering off;                            # не накапливаем — отдаём чанки сразу
        proxy_cache off;
        proxy_read_timeout 24h;                         # SSE-сессии долгие, не дропаем
        proxy_send_timeout 24h;
        chunked_transfer_encoding on;
    }

    # gzip отключён для /api (SSE), включён для статики
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_proxied any;

    # Кеширование статики
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
